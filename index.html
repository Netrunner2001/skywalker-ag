<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skywalker.ag</title>
<meta name="description" content="skywalker.ag – Funkkanal offen. Kontakt per E-Mail.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#05070d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2305070d'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23f2b544'/%3E%3Cellipse cx='32' cy='32' rx='22' ry='8' fill='none' stroke='%237fd6e8' stroke-width='2.5' transform='rotate(-24 32 32)'/%3E%3C/svg%3E">
<style>
  :root {
    --void: #05070d;
    --deep: #0b1220;
    --amber: #f2b544;
    --ice: #7fd6e8;
    --text: #dfe6f0;
    --muted: #7f8da3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, var(--deep) 0%, var(--void) 62%);
    color: var(--text);
    font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  canvas#stars { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* Planetenhorizont am unteren Bildrand */
  .horizon {
    position: fixed; left: 50%; bottom: -118vmax;
    width: 240vmax; height: 130vmax; transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(closest-side, #0a0f1a 96%, #101a2c 99%, transparent 100%);
    box-shadow:
      0 -2px 0 rgba(127, 214, 232, .55),
      0 -14px 46px rgba(127, 214, 232, .28),
      0 -60px 160px rgba(242, 181, 68, .13);
    pointer-events: none;
  }

  main {
    position: relative; z-index: 2;
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 6vh 6vw 14vh; text-align: center;
  }

  .status {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: clamp(.62rem, 1.4vw, .78rem);
    letter-spacing: .34em; text-transform: uppercase;
    color: var(--ice);
    display: inline-flex; align-items: center; gap: .9em;
    opacity: 0; animation: rise .9s .2s ease-out forwards;
  }
  .status i {
    width: .6em; height: .6em; border-radius: 50%;
    background: var(--amber); box-shadow: 0 0 12px var(--amber);
    animation: pulse 2.4s ease-in-out infinite;
  }

  h1 {
    margin: 1.1em 0 .5em;
    font-weight: 200;
    font-size: clamp(2.3rem, 9.5vw, 7.2rem);
    letter-spacing: .2em; text-indent: .2em;
    text-transform: uppercase; line-height: 1;
    color: #fff;
    text-shadow: 0 0 34px rgba(127, 214, 232, .32);
    opacity: 0; animation: rise 1.1s .45s ease-out forwards;
  }
  h1 span { color: var(--amber); font-weight: 400; text-shadow: 0 0 30px rgba(242, 181, 68, .45); }

  p.line {
    max-width: 34em;
    font-size: clamp(.95rem, 2.1vw, 1.2rem);
    font-weight: 300; line-height: 1.7; color: var(--muted);
    opacity: 0; animation: rise 1.1s .75s ease-out forwards;
  }

  a.mail {
    margin-top: 2.6em;
    position: relative; display: inline-block;
    padding: 1.05em 2.1em;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: clamp(.92rem, 2.4vw, 1.25rem);
    letter-spacing: .1em;
    color: var(--amber); text-decoration: none;
    border: 1px solid rgba(242, 181, 68, .5);
    background: rgba(242, 181, 68, .05);
    clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    transition: background .25s, color .25s, box-shadow .25s;
    opacity: 0; animation: rise 1.1s 1.05s ease-out forwards;
  }
  a.mail:hover, a.mail:focus-visible {
    background: var(--amber); color: var(--void); outline: none;
    box-shadow: 0 0 40px rgba(242, 181, 68, .4);
  }
  a.mail small {
    display: block; margin-bottom: .55em;
    font-size: .58em; letter-spacing: .32em; text-transform: uppercase; opacity: .75;
  }

  footer {
    position: fixed; z-index: 2; left: 0; right: 0; bottom: 2.2vh;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: .64rem; letter-spacing: .28em; text-transform: uppercase;
    color: rgba(127, 141, 163, .7); text-align: center;
  }

  nav.lang {
    position: fixed; z-index: 3; top: 2.4vh; right: 3vw;
    display: flex; gap: .7rem;
  }
  nav.lang button {
    width: 34px; height: 23px; padding: 0; cursor: pointer;
    background: none; border: 1px solid rgba(223, 230, 240, .25); border-radius: 3px;
    overflow: hidden; opacity: .5;
    transition: opacity .2s, border-color .2s, box-shadow .2s;
  }
  nav.lang button svg { display: block; width: 100%; height: 100%; }
  nav.lang button:hover, nav.lang button:focus-visible { opacity: .9; outline: none; border-color: var(--ice); }
  nav.lang button[aria-pressed="true"] {
    opacity: 1; border-color: var(--amber); box-shadow: 0 0 14px rgba(242, 181, 68, .45);
  }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

  @media (prefers-reduced-motion: reduce) {
    .status, h1, p.line, a.mail { animation: none; opacity: 1; }
    .status i { animation: none; }
  }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="horizon" aria-hidden="true"></div>

<nav class="lang" aria-label="Sprache / Language / Cànan">
  <button type="button" data-lang="de" aria-label="Deutsch" title="Deutsch" aria-pressed="true">
    <svg viewBox="0 0 5 3" preserveAspectRatio="none" aria-hidden="true"><rect width="5" height="1" fill="#000"/><rect y="1" width="5" height="1" fill="#DD0000"/><rect y="2" width="5" height="1" fill="#FFCE00"/></svg>
  </button>
  <button type="button" data-lang="en" aria-label="English" title="English" aria-pressed="false">
    <svg viewBox="0 0 60 30" preserveAspectRatio="none" aria-hidden="true">
      <clipPath id="uk-a"><path d="M0,0v30h60V0z"/></clipPath>
      <clipPath id="uk-b"><path d="M30,15h30v15zv15H0zH0V0zV0h30z"/></clipPath>
      <g clip-path="url(#uk-a)">
        <path d="M0,0v30h60V0z" fill="#012169"/>
        <path d="M0,0L60,30M60,0L0,30" stroke="#fff" stroke-width="6"/>
        <path d="M0,0L60,30M60,0L0,30" clip-path="url(#uk-b)" stroke="#C8102E" stroke-width="4"/>
        <path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/>
        <path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/>
      </g>
    </svg>
  </button>
  <button type="button" data-lang="gd" aria-label="Gàidhlig" title="Gàidhlig" aria-pressed="false">
    <svg viewBox="0 0 5 3" preserveAspectRatio="none" aria-hidden="true"><rect width="5" height="3" fill="#005EB8"/><path d="M0,0L5,3M5,0L0,3" stroke="#fff" stroke-width=".6"/></svg>
  </button>
</nav>

<main>
  <div class="status"><i></i><span data-i18n="status">Funkkanal offen</span></div>
  <h1>Skywalker<span>.ag</span></h1>
  <p class="line"><span data-i18n="line1">Hier draußen ist es still. Keine Fracht, kein Logbuch, kein Kurs.</span><br><span data-i18n="line2">Nur eine Frequenz, auf der jemand zuhört.</span></p>
  <a class="mail" href="mailto:luke@skywalker.ag"><small data-i18n="cta">Nachricht senden an</small>luke@skywalker.ag</a>
</main>

<footer data-i18n="footer">Sektor AG · Position stabil</footer>

<script>
(function () {
  var T = {
    de: {
      status: 'Funkkanal offen',
      line1: 'Hier draußen ist es still. Keine Fracht, kein Logbuch, kein Kurs.',
      line2: 'Nur eine Frequenz, auf der jemand zuhört.',
      cta: 'Nachricht senden an',
      footer: 'Sektor AG · Position stabil',
      desc: 'skywalker.ag – Funkkanal offen. Kontakt per E-Mail.'
    },
    en: {
      status: 'Frequency open',
      line1: 'It is quiet out here. No cargo, no logbook, no course.',
      line2: 'Just one frequency where someone is listening.',
      cta: 'Send a message to',
      footer: 'Sector AG · Position stable',
      desc: 'skywalker.ag – frequency open. Contact by email.'
    },
    gd: {
      status: 'Seanail fosgailte',
      line1: 'Tha e sàmhach a-muigh an seo. Gun luchd, gun leabhar-latha, gun chùrsa.',
      line2: 'Dìreach aon tricead far a bheil cuideigin ag èisteachd.',
      cta: 'Cuir teachdaireachd gu',
      footer: 'Roinn AG · Suidheachadh seasmhach',
      desc: 'skywalker.ag – seanail fosgailte. Cuir fios air post-d.'
    }
  };
  var buttons = document.querySelectorAll('nav.lang button');

  function apply(lang, remember) {
    if (!T[lang]) lang = 'de';
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      el.textContent = T[lang][el.getAttribute('data-i18n')];
    });
    var meta = document.querySelector('meta[name="description"]');
    if (meta) meta.setAttribute('content', T[lang].desc);
    buttons.forEach(function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false');
    });
    if (remember) {
      try { localStorage.setItem('lang', lang); } catch (e) {}
      try { history.replaceState(null, '', lang === 'de' ? location.pathname : '#' + lang); } catch (e) {}
    }
  }

  buttons.forEach(function (b) {
    b.addEventListener('click', function () { apply(b.getAttribute('data-lang'), true); });
  });

  var start = location.hash.replace('#', '');
  if (!T[start]) { try { start = localStorage.getItem('lang'); } catch (e) { start = null; } }
  if (!T[start]) {
    var n = (navigator.language || 'de').toLowerCase();
    start = n.indexOf('gd') === 0 ? 'gd' : n.indexOf('de') === 0 ? 'de' : 'en';
  }
  apply(start, false);
})();
</script>

<script>
(function () {
  var c = document.getElementById('stars'), x = c.getContext('2d');
  var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var w, h, dpr, stars = [], mx = 0, my = 0;

  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr;
    var n = Math.round(innerWidth * innerHeight / 2600);
    stars = [];
    for (var i = 0; i < n; i++) {
      var z = Math.random();
      stars.push({
        x: Math.random() * w, y: Math.random() * h, z: z,
        r: (0.3 + z * 1.3) * dpr,
        t: Math.random() * 6.28, s: 0.4 + Math.random() * 1.4,
        warm: Math.random() < 0.12
      });
    }
  }

  function draw(time) {
    x.clearRect(0, 0, w, h);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      if (!still) {
        s.x -= (0.02 + s.z * 0.12) * dpr;
        if (s.x < -4) s.x = w + 4;
      }
      var a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(s.t + time * 0.001 * s.s));
      x.globalAlpha = a * (0.35 + s.z * 0.65);
      x.fillStyle = s.warm ? '#f2b544' : '#dbeeff';
      x.beginPath();
      x.arc(s.x + mx * s.z * 18 * dpr, s.y + my * s.z * 18 * dpr, s.r, 0, 6.2832);
      x.fill();
    }
    x.globalAlpha = 1;
    if (!still) requestAnimationFrame(draw);
  }

  addEventListener('resize', function () { size(); if (still) draw(0); });
  addEventListener('pointermove', function (e) {
    mx = (e.clientX / innerWidth - 0.5) * -1;
    my = (e.clientY / innerHeight - 0.5) * -1;
  });
  size();
  if (still) draw(0); else requestAnimationFrame(draw);
})();
</script>
</body>
</html>
